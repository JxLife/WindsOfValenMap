<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Winds of Valen — Interactive Map</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Winds of Valen <span>Interactive Map</span></h1>
    <div class="controls">
      <input type="search" id="search" placeholder="Search markers..." autocomplete="off" />
      <div class="legend" id="legend"></div>
      <div class="zoom-buttons">
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="zoom-reset" title="Reset view">⤾</button>
        <button id="zoom-in" title="Zoom in">+</button>
      </div>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="map-layer" id="map-layer">
      <img id="map-image" src="map.jpg" draggable="false" alt="Winds of Valen world map" />
    </div>
    <div class="marker-layer" id="marker-layer"></div>
  </main>

  <div class="hint">Drag to pan &middot; Scroll to zoom &middot; Click a marker to open its wiki page</div>

  <script src="app.js"></script>
</body>
</html>
